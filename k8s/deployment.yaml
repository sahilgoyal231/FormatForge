apiVersion: apps/v1
kind: Deployment
metadata:
  name: format-forge-deployment
  labels:
    app: format-forge
spec:
  replicas: 3
  selector:
    matchLabels:
      app: format-forge
  template:
    metadata:
      labels:
        app: format-forge
    spec:
      containers:
      - name: format-forge
        image: format-forge:latest # Replace with your container registry image
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
        envFrom:
        - secretRef:
            name: format-forge-secrets
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 10
